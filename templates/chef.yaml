## pi-chef user config: ~/.pi/agent/chef.yaml
##
## Your personal settings, for every project. Everything is commented out, so the built-in defaults apply.
## To change a setting, uncomment its line AND its section header (remove the "# " at the start), then edit it.
## Lines starting "##" are explanations. Changes apply to the next command; no restart is needed.
##
## The project file .pi-workflows/config.yaml layers on top of this one, a whole section at a time: a section it
## sets replaces yours. local, agents, pricing and workspaceDir are read from this file only.
## Every setting is described in docs/configuration.md. Never put a secret, API key or token in this file.

## ---------------------------------------------------------------------------------------------------------------
## Models: which model builds the tickets of each difficulty, and which reviews. The model you chat with and that
## plans (/plan) is whatever you pick with Pi's /model.
## A value is provider/id (a Pi model; add :high, :low ... to set its thinking level), or agent:<name> or
## agent:<name>/<model> for an external coding agent (claude, codex, cursor-agent, grok, agy, gemini, opencode).
## A failed ticket climbs low, then medium, then high, then stops.

# models:
#   low: xai/grok-4.7
#   medium: anthropic/claude-sonnet-5-5
#   high: openai/gpt-6.1-sol
#   review: anthropic/claude-opus-5-5

## ---------------------------------------------------------------------------------------------------------------
## A local model server (llama.cpp's llama-server, Ollama), registered with Pi as provider "local". Use its models
## as local/<id> above. contextWindow must match what the server runs (--ctx-size, OLLAMA_CONTEXT_LENGTH): the
## planner keeps tickets for it to half that size. Setup: docs/providers.md.

# local:
#   baseUrl: http://127.0.0.1:8081/v1
#   apiKeyEnv: LOCAL_API_KEY   # a variable holding the server's key, if it needs one
#   models:
#     - { id: Qwen3.8-27B, contextWindow: 131072, maxTokens: 16384 }

## ---------------------------------------------------------------------------------------------------------------
## Agents: overrides of the built-in agents, or new ones. run is the command that starts the agent; modelFlag picks
## its model for agent:<name>/<model>. Built in: claude, codex, cursor-agent, grok, agy, gemini, opencode. A run you set
## replaces the built-in command, flags included (docs/configuration.md lists the defaults).

# agents:
#   claude: { run: [claude, --permission-mode, acceptEdits], modelFlag: --model }   # the built-in default, written out

## ---------------------------------------------------------------------------------------------------------------
## Budgets: hard stops on spend, in USD. A prompt, ticket or review call does not start at the limit.

# budgets:
#   taskUsd: 20             # one task's spend
#   dailyUsd: 75            # all spend today
#   softWarningRatio: 0.8   # warn at 80% of a budget
#   unknownCallUsd: 0.05    # what a call with an unknown cost counts as, in budget math only

## ---------------------------------------------------------------------------------------------------------------
## Routing: how far a failed ticket climbs, and how long one attempt may run.

# routing:
#   maxEscalations: 2         # rungs a failed ticket may climb (low to medium to high is 2)
#   maxTicketTurns: 100       # assistant turns a /build ticket attempt may take before it is told to wrap up

## ---------------------------------------------------------------------------------------------------------------
## The review model: the per-ticket review of /build gates each commit, and /review adds one advisory model pass.

# review:
#   tickets: true           # false: no per-ticket review in /build at all
#   model: true             # false: /review runs the checks and the static scan only
#   maxDiffChars: 120000    # one call's diff; a bigger diff is split by file (/review) or clipped (per ticket)
#   maxChunks: 6            # at most this many calls of /review's model pass
#   timeoutMs: 300000       # per call (the model pass and the per-ticket review)

## ---------------------------------------------------------------------------------------------------------------
## Pricing: USD per million tokens. A model with no row has an unknown cost (a local model is $0).
## PLACEHOLDER prices: subscription models (ChatGPT, Claude, SuperGrok) have no per-token cost, so they are 0 here;
## a per-token API key bills for real, so take those prices from the provider's rate card.

# pricing:
#   - { provider: xai, model: grok-4.7, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
#   - { provider: anthropic, model: claude-sonnet-5-5, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
#   - { provider: openai, model: "gpt-6.1-sol", effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
#   - { provider: anthropic, model: claude-opus-5-5, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }

## ---------------------------------------------------------------------------------------------------------------
## Everything else.

# branchPrefix: chef            # /build names its branch <branchPrefix>/<task name>
# workspaceDir: .pi-workflows   # where task state, the ledger and reports live, in each project
