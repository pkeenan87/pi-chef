# Operator config for the cost-optimized Pi workflow.
# No secrets belong in this file. Prices below are placeholders with an
# effective date — replace them from your provider's current rate card.
# The runtime never falls back to a price baked into source code.

providers:
  openai:
    type: openai
    auth: account-login   # ChatGPT sign-in through Pi /login openai; no API key
    piProvider: openai
  anthropic:
    type: anthropic
    auth: account-login   # Claude Pro/Max sign-in through Pi /login anthropic
    # To use a key saved with Pi's /login anthropic instead, set apiKeyFallback: true for anthropic in
    # ~/.pi/agent/cost-workflow.yaml (ignored here). It is billed per token (see the api-key pricing rows).
  xai:
    type: xai
    auth: account-login   # SuperGrok / X Premium sign-in through Pi /login xai
  foundry:
    type: azure-foundry
    auth: azure-cli
    endpointEnv: AZURE_AI_ENDPOINT   # https://<resource>.services.ai.azure.com (export it; not stored here)
    routeStyle: v1                   # <endpoint>/openai/v1/..., deployment name in `model`, no api-version
    audience: https://ai.azure.com   # az account get-access-token --resource https://ai.azure.com
    api: openai-completions
    # decisionsPath: /decisions      # UNVERIFIED for Microsoft-Decision-1 in Foundry; change if your deployment differs
  vercel:
    type: vercel-ai-gateway
    auth: vercel-cli
    baseUrl: https://ai-gateway.vercel.sh/v1
    projectDir: .          # a directory you ran `vercel login && vercel link` in
    envFile: .env.local    # written by `vercel env pull .env.local --yes`
  local:
    type: openai-compatible
    baseUrl: http://127.0.0.1:11434/v1
    model: qwen2.5-coder:7b

# Candidates per tier. Within a tier the router picks by learned expected cost per success
# (Thompson sampling over per-model successes and failures), breaking ties by the order here.
# A candidate is skipped when its provider is not signed in, an org allowlist excludes it,
# its circuit is open, or its expected cost exceeds the remaining budget.
# Foundry `model` values are YOUR deployment names. The names below are placeholders.
# `api: decisions` models answer structured questions; they are not chat models.
tiers:
  deterministic:        # used only when the local server answers; otherwise the plan's literal edits apply
    - { provider: local, model: "qwen2.5-coder:7b" }
  classifier:
    - { provider: foundry, model: Microsoft-Decision-1, api: decisions, label: "Decision-1 (Foundry)" }
    - { provider: vercel, model: "typesafe-ai/jev", api: decisions, label: "jev (Vercel AI Gateway)" }
  cheap:
    - { provider: openai, model: gpt-6-luna }
    - { provider: anthropic, model: claude-haiku-5-5 }
  standard:
    - { provider: anthropic, model: claude-sonnet-5-5 }
    - { provider: xai, model: grok-4.7, label: "Grok 4.7 (SuperGrok)" }
    - { provider: foundry, model: grok-4-7, label: "Grok 4.7 (Foundry)" }
  premium:
    - { provider: anthropic, model: claude-opus-5-5 }
    - { provider: openai, model: "gpt-6.1-sol" }
  advisor:              # on demand via /advisor <question>; Pi only suggests it, never calls it on its own
    - { provider: anthropic, model: claude-fable-5-1 }
    - { provider: openai, model: gpt-6-astra }
    - { provider: foundry, model: gpt-6-astra, label: "GPT Astra (Foundry deployment)" }

routing:
  minConfidence: 0.75
  maxEscalations: 2
  maxTier: premium
  requirePremiumReviewFor:
    - auth
    - permissions
    - secrets
    - security-sensitive
  circuitBreakerFailures: 3
  # Ranking only (never billed, never in a budget): USD added to every candidate's price before dividing by its
  # success rate. It stands for the time and retry cost of a failed attempt, so a $0 subscription model with a
  # poor record does not always win. 0 turns it off.
  attemptOverheadUsd: 0.02

workers:
  tokenBudget: 8000
  ticketContextTokens: 150000

branchPrefix: cost

budgets:
  taskUsd: 20
  dailyUsd: 75
  softWarningRatio: 0.8

approvals:
  plan: required
  merge: manual
  securitySensitiveFix: required

checks: []

orgProviderAllowlist: []
proprietaryCode: false

# PLACEHOLDER PRICES. Replace every row from your provider's current rate card before trusting
# cost-per-success ranking. A candidate with no row is ranked after priced ones and flagged.
# Subscription models (ChatGPT, Claude Pro/Max) have no per-token marginal cost, so they are
# listed at 0 on purpose; keep the rows so the candidates are explicit. A subscription can still
# bill extra usage, which this file cannot see.
pricing:
  - { provider: local, model: "qwen2.5-coder:7b", effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  # Decisions models (placeholders)
  - { provider: foundry, model: Microsoft-Decision-1, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0.10, outputPerMillionUsd: 0.10 }
  - { provider: vercel, model: "typesafe-ai/jev", effectiveFrom: "2026-01-01", inputPerMillionUsd: 0.10, outputPerMillionUsd: 0.10 }
  # Subscription-backed (0 marginal; placeholder)
  - { provider: openai, model: gpt-6-luna, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: anthropic, model: claude-haiku-5-5, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: anthropic, model: claude-sonnet-5-5, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: anthropic, model: claude-opus-5-5, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: openai, model: "gpt-6.1-sol", effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: anthropic, model: claude-fable-5-1, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: openai, model: gpt-6-astra, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: xai, model: grok-4.7, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  # API-key billing (used only while Pi holds an API key for the provider and the user config sets
  # apiKeyFallback). Anthropic first-party rates as of 2026-10; cache writes are 1.25x input (5-minute cache).
  # Haiku 5.5 doubles past 100K-token prompts; the row uses the base rate. Without these rows the cost is unknown.
  - { provider: anthropic, model: claude-haiku-5-5, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 0.10, outputPerMillionUsd: 0.50, cacheReadPerMillionUsd: 0.01, cacheWritePerMillionUsd: 0.125 }
  - { provider: anthropic, model: claude-sonnet-5-5, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 2, outputPerMillionUsd: 10, cacheReadPerMillionUsd: 0.20, cacheWritePerMillionUsd: 2.5 }
  - { provider: anthropic, model: claude-opus-5-5, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 4, outputPerMillionUsd: 20, cacheReadPerMillionUsd: 0.20, cacheWritePerMillionUsd: 5 }
  - { provider: anthropic, model: claude-fable-5-1, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 10, outputPerMillionUsd: 50, cacheReadPerMillionUsd: 0.25, cacheWritePerMillionUsd: 12.5 }
  - { provider: xai, model: grok-4.7, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 2, outputPerMillionUsd: 6, cacheReadPerMillionUsd: 0.5, cacheWritePerMillionUsd: 0 }
  # Per-token Foundry deployments (placeholders)
  - { provider: foundry, model: grok-4-7, effectiveFrom: "2026-01-01", inputPerMillionUsd: 3, outputPerMillionUsd: 15 }
  - { provider: foundry, model: gpt-6-astra, effectiveFrom: "2026-01-01", inputPerMillionUsd: 5, outputPerMillionUsd: 25 }

# Subscription quota (ranking only). The subscription rows above are $0, so without this the selector
# would rank Haiku and Opus the same on cost. A shadow price (USD per million tokens, any token kind)
# is added to each model's expected cost per success when ranking candidates within a tier, so easy
# work goes to quota-cheap models and Opus/Sol/Fable quota is saved for hard tasks. Shadow prices
# NEVER reach the ledger's actualUsd, budgets, or the over-budget filter. PLACEHOLDER weights: tune them
# to how scarce each model's quota is on your plan.
quota:
  models:
    - { provider: openai, model: gpt-6-luna, perMillionTokensUsd: 0.4 }
    - { provider: anthropic, model: claude-haiku-5-5, perMillionTokensUsd: 1 }
    - { provider: anthropic, model: claude-sonnet-5-5, perMillionTokensUsd: 3 }
    - { provider: anthropic, model: claude-opus-5-5, perMillionTokensUsd: 10 }
    - { provider: openai, model: "gpt-6.1-sol", perMillionTokensUsd: 8 }
    - { provider: anthropic, model: claude-fable-5-1, perMillionTokensUsd: 20 }
    - { provider: openai, model: gpt-6-astra, perMillionTokensUsd: 15 }
    - { provider: xai, model: grok-4.7, perMillionTokensUsd: 3 }
  # Optional soft caps per provider, in tokens (input + output + cache, as reported). Daily uses the
  # budget day (UTC); weekly is the rolling 7 days. At or over a cap, that provider's shadow prices are
  # multiplied by overCapMultiplier, which pushes work to the other provider or to metered models.
  # Nothing is ever blocked by a quota cap. /cost shows usage per provider.
  # providers:
  #   anthropic: { dailyTokens: 20000000, weeklyTokens: 100000000 }
  #   openai: { dailyTokens: 20000000, weeklyTokens: 100000000 }
  overCapMultiplier: 4
