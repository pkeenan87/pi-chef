# Operator config for the chef workflow.
# No secrets belong in this file. Prices below are placeholders with an
# effective date — replace them from your provider's current rate card.
# The runtime never falls back to a price baked into source code.

providers:
  openai:
    type: openai
    auth: account-login   # ChatGPT sign-in through Pi /login openai; no API key
    piProvider: openai
  anthropic:
    type: anthropic
    auth: account-login   # Claude Pro/Max sign-in through Pi /login anthropic
    # To use a key saved with Pi's /login anthropic instead, set apiKeyFallback: true for anthropic in
    # ~/.pi/agent/chef.yaml (ignored here). It is billed per token (see the api-key pricing rows).
  xai:
    type: xai
    auth: account-login   # SuperGrok / X Premium sign-in through Pi /login xai
  foundry:
    type: azure-foundry
    auth: azure-cli
    endpointEnv: AZURE_AI_ENDPOINT   # https://<resource>.services.ai.azure.com (export it; not stored here)
    routeStyle: v1                   # <endpoint>/openai/v1/..., deployment name in `model`, no api-version
    audience: https://ai.azure.com   # az account get-access-token --resource https://ai.azure.com
    api: openai-completions
  vercel:
    type: vercel-ai-gateway
    auth: vercel-cli
    baseUrl: https://ai-gateway.vercel.sh/v1
    projectDir: .          # a directory you ran `vercel login && vercel link` in
    envFile: .env.local    # written by `vercel env pull .env.local --yes`
  local:
    type: openai-compatible
    baseUrl: http://127.0.0.1:11434/v1

# Candidates per tier. With routing.selection: ordered (the default) the first usable entry runs and the
# rest are fallbacks, in this order. With selection: adaptive the router picks by learned expected cost per
# success (Thompson sampling over per-model successes and failures), breaking ties by the order here.
# A candidate is skipped when its provider is not signed in, an org allowlist excludes it,
# its circuit is open, or its expected cost exceeds the remaining budget.
# Who does what:
#   the main chat session       session.model (Opus 5.5), a normal Pi model pinned at session start
#   compaction summaries        session.compactionTier (cheap: Haiku 5.5), through session_before_compact
#   standalone batch jobs       batch (Luna): one-line summaries of files a diff clip cut
#   /build tickets              ticketLow / ticketMedium / ticketHigh by the ticket's difficulty; a failure
#                               climbs ticketLow -> ticketMedium -> ticketHigh -> premium
#   /review model pass          routing.reviewTier (premium: Opus 5.5)
#   /plan and previews          standard (premium for high complexity or security-sensitive work)
# Foundry `model` values are model names. They are called as Azure deployments of the same name unless your config maps
# them with providers.foundry.deployments: { "gpt-6.1-sol": "my-sol" }. The Foundry entries are fallbacks for when the account
# login does not work (ChatGPT Enterprise, no SuperGrok). A Foundry candidate with no endpoint or no az login is
# unavailable and skipped, so they change nothing without Foundry. Foundry is billed per token (see pricing).
# `api` on a Foundry entry overrides providers.foundry.api for that deployment; gpt-6.1-sol needs openai-responses
# to use tools.
# Nothing classifies by model: the planner (Opus) rates complexity, risk and security in plan_spec, and a keyword scan
# can raise the security flag. Foundry and Vercel serve chat models such as the Astra deployment below.
tiers:
  cheap:                # compaction summaries (session.compactionTier)
    - { provider: anthropic, model: claude-haiku-5-5 }
  batch:                # standalone jobs the extension runs by itself, outside any conversation (cut-file summaries)
    - { provider: openai, model: gpt-6-luna }
    - { provider: foundry, model: gpt-6-luna, label: "GPT Luna (Foundry)" }
  standard:             # /plan and preview routes
    - { provider: anthropic, model: claude-sonnet-5-5 }
    - { provider: openai, model: "gpt-6.1-sol" }
    - { provider: foundry, model: "gpt-6.1-sol", label: "GPT Sol (Foundry)", api: openai-responses }
  premium:              # the last rung of the ticket ladder and /review
    - { provider: anthropic, model: claude-opus-5-5 }
  ticketLow:            # difficulty: low (mechanical or small and well specified)
    - { provider: xai, model: grok-4.7, label: "Grok 4.7 (SuperGrok)" }
    - { provider: foundry, model: grok-4-7, label: "Grok 4.7 (Foundry)" }
  ticketMedium:         # difficulty: medium (typical feature work)
    - { provider: anthropic, model: claude-sonnet-5-5 }
  ticketHigh:           # difficulty: high (cross-cutting, tricky logic, concurrency, security, large blast radius)
    - { provider: openai, model: "gpt-6.1-sol" }
    - { provider: foundry, model: "gpt-6.1-sol", label: "GPT Sol (Foundry)", api: openai-responses }
  # Local mode (/plan --local): the local model is set in your user config (~/.pi/agent/chef.yaml, tiers.local), since it
  # is what runs on your machine; with none there, the built-in qwen3.5:9b (Ollama) is used. Not set here on purpose.
  advisor:              # on demand via /advisor <question>; Pi only suggests it, never calls it on its own
    - { provider: openai, model: gpt-6-astra }
    - { provider: anthropic, model: claude-fable-5-1 }
    - { provider: foundry, model: gpt-6-astra, label: "GPT Astra (Foundry deployment)" }

# Local mode. /plan --local (or default: true) has the session model write tickets the tiers.local model can finish
# alone, sized from that model: under 14B (or no size in the tag) low tickets in up to 2 files, 14B and up low or
# medium in up to 3; numbered steps, a check each, half its contextWindow. /build runs them on that model only.
# Planning and the per-ticket review stay on the session and review models. Local models are priced at $0.
# difficulties: [low] sends only low tickets (and docs-only ones) to the local model, the rest to the cloud tiers.
localMode:
  default: false              # true: every /plan is local unless you pass --cloud

routing:
  maxEscalations: 3     # a failed ticket climbs low -> medium -> high -> premium
  maxTier: premium
  selection: ordered    # first usable model in each tier's order; adaptive = cost per success, sampled
  reviewTier: premium   # the /review model pass; a failed part falls back to standard
  requirePremiumReviewFor:
    - auth
    - permissions
    - secrets
    - security-sensitive
  circuitBreakerFailures: 3
  # Ranking only (never billed, never in a budget): USD added to every candidate's price before dividing by its
  # success rate. It stands for the time and retry cost of a failed attempt, so a $0 subscription model with a
  # poor record does not always win. 0 turns it off.
  attemptOverheadUsd: 0.02

# The main chat session is a normal Pi model, not a router. Compaction summaries come from a cheap model.
# session.model / session.compactionTier are user-config-only (~/.pi/agent/chef.yaml); a project may only set
# session.pin: false. Defaults: anthropic/claude-opus-5-5, pinned at session start, compaction on the cheap tier.

workers:
  tokenBudget: 8000
  ticketContextTokens: 150000

# Second opinions. Advisors advise; the Opus session or review model resolves, and approval stays yours.
#   /plan     plan_consult puts the draft tickets and 2-3 questions to every advisor (one per provider), once per
#             plan version; plan_tickets then needs Opus's advisorResolution.
#   /build    after a ticket's checks pass, Opus reads the ticket and its own diff and may put 2-3 questions to the
#             advisor tier. High tickets consult every advisor in parallel; low and medium none (fromDifficulty:
#             medium gives medium tickets one advisor from another provider). Opus gives the final verdict.
#   /review   a branch with a high ticket consults both; otherwise none (fromDifficulty: medium: one from another
#             vendor for a medium branch, and Astra above adHocMinLines changed lines with no plan).
# Skipped when the budget is soft or exhausted. Astra is $0 on a ChatGPT subscription; Fable is billed per token on
# an API key (see the api-key pricing rows).
advisors:
  # tickets / plan / summarizeCut default to true; a project can only turn them off (false), never on.
  fromDifficulty: high  # advisors for high tickets only; medium adds one advisor for medium tickets (more calls)
  adHocMinLines: 400    # with fromDifficulty: medium, /review on a branch with no plan: Astra above this many changed lines
  timeoutMs: 180000     # per advisor or review call
  maxDiffChars: 40000   # the ticket diff sent to the reviewer and advisors; the rest is listed as cut
  maxOutputTokens: 1500 # visible answer an advisor is asked to stay within (the request adds room for reasoning)

branchPrefix: chef

budgets:
  taskUsd: 20
  dailyUsd: 75
  softWarningRatio: 0.8
  # Budget math only: what one ledger entry with unknown cost and nothing to price it from (for example a
  # call whose usage was lost) counts as. The ledger keeps it as unknown. A project can only raise it.
  unknownCallUsd: 0.05

approvals:
  plan: required
  merge: manual

checks: []

orgProviderAllowlist: []
proprietaryCode: false

# PLACEHOLDER PRICES. Replace every row from your provider's current rate card before trusting
# cost-per-success ranking. A candidate with no row is ranked after priced ones and flagged.
# Subscription models (ChatGPT, Claude Pro/Max) have no per-token marginal cost, so they are
# listed at 0 on purpose; keep the rows so the candidates are explicit. A subscription can still
# bill extra usage, which this file cannot see.
pricing:
  # Subscription-backed (0 marginal; placeholder)
  - { provider: openai, model: gpt-6-luna, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: anthropic, model: claude-haiku-5-5, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: anthropic, model: claude-sonnet-5-5, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: anthropic, model: claude-opus-5-5, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: openai, model: "gpt-6.1-sol", effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: anthropic, model: claude-opus-4-8, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: anthropic, model: claude-fable-5-1, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: openai, model: gpt-6-astra, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  - { provider: xai, model: grok-4.7, effectiveFrom: "2026-01-01", inputPerMillionUsd: 0, outputPerMillionUsd: 0, cacheReadPerMillionUsd: 0, cacheWritePerMillionUsd: 0 }
  # API-key billing (used only while Pi holds an API key for the provider and the user config sets
  # apiKeyFallback). Anthropic first-party rates as of 2026-10; cache writes are 1.25x input (5-minute cache).
  # Haiku 5.5 doubles past 100K-token prompts; the row uses the base rate. Without these rows the cost is unknown.
  - { provider: anthropic, model: claude-haiku-5-5, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 0.10, outputPerMillionUsd: 0.50, cacheReadPerMillionUsd: 0.01, cacheWritePerMillionUsd: 0.125 }
  - { provider: anthropic, model: claude-sonnet-5-5, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 2, outputPerMillionUsd: 10, cacheReadPerMillionUsd: 0.20, cacheWritePerMillionUsd: 2.5 }
  - { provider: anthropic, model: claude-opus-5-5, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 4, outputPerMillionUsd: 20, cacheReadPerMillionUsd: 0.20, cacheWritePerMillionUsd: 5 }
  - { provider: anthropic, model: claude-opus-4-8, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 5, outputPerMillionUsd: 25, cacheReadPerMillionUsd: 0.50, cacheWritePerMillionUsd: 6.25 }
  - { provider: anthropic, model: claude-fable-5-1, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 10, outputPerMillionUsd: 50, cacheReadPerMillionUsd: 0.25, cacheWritePerMillionUsd: 12.5 }
  - { provider: xai, model: grok-4.7, billing: api-key, effectiveFrom: "2026-10-01", inputPerMillionUsd: 2, outputPerMillionUsd: 6, cacheReadPerMillionUsd: 0.5, cacheWritePerMillionUsd: 0 }
  # Per-token Foundry deployments: the fallback when an account login does not work. Billed per token, so no quota
  # rows. Azure list prices; verify against your Azure rate card. Rename `model` to your deployment names.
  - { provider: foundry, model: "gpt-6.1-sol", effectiveFrom: "2026-10-16", inputPerMillionUsd: 2, outputPerMillionUsd: 10, cacheReadPerMillionUsd: 0.10 }
  - { provider: foundry, model: gpt-6-luna, effectiveFrom: "2026-10-16", inputPerMillionUsd: 0.10, outputPerMillionUsd: 0.50, cacheReadPerMillionUsd: 0.01 }
  - { provider: foundry, model: gpt-6-astra, effectiveFrom: "2026-10-16", inputPerMillionUsd: 10, outputPerMillionUsd: 50, cacheReadPerMillionUsd: 1 }
  - { provider: foundry, model: grok-4-7, effectiveFrom: "2026-10-16", inputPerMillionUsd: 2, outputPerMillionUsd: 6, cacheReadPerMillionUsd: 0.50 }

# Subscription quota (ranking only). The subscription rows above are $0, so without this the selector
# would rank Haiku and Opus the same on cost. A shadow price (USD per million tokens, any token kind)
# is added to each model's expected cost per success when ranking candidates within a tier, so easy
# work goes to quota-cheap models and Opus/Sol/Fable quota is saved for hard tasks. Shadow prices
# NEVER reach the ledger's actualUsd, budgets, or the over-budget filter. PLACEHOLDER weights: tune them
# to how scarce each model's quota is on your plan.
quota:
  models:
    - { provider: openai, model: gpt-6-luna, perMillionTokensUsd: 0.4 }
    - { provider: anthropic, model: claude-haiku-5-5, perMillionTokensUsd: 1 }
    - { provider: anthropic, model: claude-sonnet-5-5, perMillionTokensUsd: 3 }
    - { provider: anthropic, model: claude-opus-5-5, perMillionTokensUsd: 10 }
    - { provider: openai, model: "gpt-6.1-sol", perMillionTokensUsd: 8 }
    - { provider: anthropic, model: claude-fable-5-1, perMillionTokensUsd: 20 }
    - { provider: openai, model: gpt-6-astra, perMillionTokensUsd: 15 }
    - { provider: xai, model: grok-4.7, perMillionTokensUsd: 3 }
  # Optional soft caps per provider, in tokens (input + output + cache, as reported). Daily uses the
  # budget day (UTC); weekly is the rolling 7 days. At or over a cap, that provider's shadow prices are
  # multiplied by overCapMultiplier, which pushes work to the other provider or to metered models.
  # Nothing is ever blocked by a quota cap. /cost shows usage per provider.
  # providers:
  #   anthropic: { dailyTokens: 20000000, weeklyTokens: 100000000 }
  #   openai: { dailyTokens: 20000000, weeklyTokens: 100000000 }
  overCapMultiplier: 4
